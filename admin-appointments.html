<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manage Appointments | REDCARE HOSPITALS Admin (Demo)</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/images/hero.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div id="site-header"></div>
<nav class="portal-nav admin-bar" aria-label="Admin area"><div class="container"><ul>
<li><a href="admin-dashboard.html">Dashboard</a></li><li><a href="admin-doctors.html">Doctors</a></li><li><a href="admin-departments.html">Departments</a></li><li><a href="admin-appointments.html" aria-current="page">Appointments</a></li><li><a href="admin-patients.html">Patients</a></li></ul></div></nav>
<main id="main" class="portal"><div class="container">
<div id="portal-loading" class="state"><span class="spinner" aria-hidden="true"></span> Verifying administrator access…</div>
<div id="portal" hidden>
<div id="admin-message" aria-live="polite"></div>
<h1>Appointments</h1>
<div class="toolbar"><div class="field"><label for="f-search">Search</label><input id="f-search" type="search" placeholder="Reference or patient"></div>
<div class="field"><label for="f-date">Date</label><input id="f-date" type="date"></div>
<div class="field"><label for="f-doctor">Doctor</label><select id="f-doctor"></select></div>
<div class="field"><label for="f-dept">Department</label><select id="f-dept"></select></div>
<div class="field"><label for="f-status">Status</label><select id="f-status"><option value="">All</option><option value="pending">Pending</option><option value="confirmed">Confirmed</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option></select></div>
<button class="btn btn-outline" type="button" id="f-clear">Clear</button></div>
<p class="muted" id="count" aria-live="polite"></p>
<div class="panel" id="appt-wrap"></div>
<dialog id="appt-dialog" aria-labelledby="appt-title"><div id="appt-body"></div></dialog>
</div></div></main>
<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script src="js/main.js"></script>
<script src="js/admin-appointments.js"></script>
</body>
</html>
