<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register | REDCARE HOSPITALS (Demo)</title>
<meta name="description" content="REDCARE HOSPITALS is a fictional healthcare portfolio demonstration.">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body>
<div id="site-header"></div>
<main id="main">
<div class="auth-wrap" data-auth>
<div class="auth-card">
<h1>Create a patient account</h1>
<p class="muted">Demo registration. Please do not enter real medical information.</p>
<div id="auth-message" aria-live="polite"></div>
<form id="register-form" novalidate>
<div class="field"><label for="g-name">Full name <span class="req">*</span></label><input id="g-name" name="full_name" autocomplete="name" required></div>
<div class="field"><label for="g-email">Email <span class="req">*</span></label><input id="g-email" name="email" type="email" autocomplete="email" required></div>
<div class="field"><label for="g-phone">Phone (optional)</label><input id="g-phone" name="phone" type="tel" autocomplete="tel"></div>
<div class="field"><label for="g-pw">Password <span class="req">*</span></label><input id="g-pw" name="password" type="password" autocomplete="new-password" required><p class="hint">At least 8 characters, with a letter and a number.</p></div>
<div class="field"><label for="g-cf">Confirm password <span class="req">*</span></label><input id="g-cf" name="confirm" type="password" autocomplete="new-password" required></div>
<button class="btn btn-primary" type="submit">Create account</button>
</form>
<div class="auth-links"><span>Already registered? <a href="login.html">Log in</a></span></div>
</div></div>
</main>
<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script src="js/main.js"></script>
</body>
</html>
