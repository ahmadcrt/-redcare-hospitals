<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="robots" content="noindex">
<link rel="icon" href="hero.svg" type="image/svg+xml">

<body>
<div id="site-header"></div>
<nav class="portal-nav" aria-label="Patient area"><div class="container"><ul>
<li><a href="patient-dashboard.html">Dashboard</a></li><li><a href="patient-appointments.html" aria-current="page">My Appointments</a></li><li><a href="patient-profile.html">Profile</a></li><li><a href="appointments.html">Book New</a></li></ul></div></nav>
<main id="main" class="portal"><div class="container">

<div id="portal" hidden>

<div class="panel" id="appt-list"></div>
<dialog id="appt-dialog" aria-labelledby="appt-title"><div id="appt-body"></div></dialog>
</div></div></main>
<div id="site-footer"></div>
